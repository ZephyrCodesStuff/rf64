name: Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write # Required for GitHub Actions to create the release

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AVR Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr

      - name: Install Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Firmware (.hex and .bin)
        run: |
          chmod +x scripts/build_firmware.sh
          ./scripts/build_firmware.sh --release
          OUT_NAME=rf64_lowbrightness ./scripts/build_firmware.sh --release --no-default-features --features "boot-anim,apollo"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rf64-firmware
          path: |
            target/rf64.elf
            target/rf64.bin
            target/rf64.hex
            target/rf64_lowbrightness.elf
            target/rf64_lowbrightness.bin
            target/rf64_lowbrightness.hex
          retention-days: 1

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch git history for the commit message

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get latest commit message
        id: commit_msg
        run: |
          # Grabs the last commit message and handles multi-line outputs safely
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "msg<<$EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
          # expose short SHA for use in the release name/tag
          echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # create a release/tag that points at the pushed commit (no pre-existing tag required)
          tag_name: release-${{ steps.commit_msg.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          name: "🔖 Release #${{ steps.commit_msg.outputs.short_sha }}"
          body: ${{ steps.commit_msg.outputs.msg }}
          files: |
            artifacts/rf64.elf
            artifacts/rf64.bin
            artifacts/rf64.hex
            artifacts/rf64_lowbrightness.elf
            artifacts/rf64_lowbrightness.bin
            artifacts/rf64_lowbrightness.hex

