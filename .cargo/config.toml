[build]
target = "avr-none"
rustflags = ["-C", "target-cpu=atmega32u4", "-C", "no-vectorize-loops"]

[unstable]
build-std = ["core"]

[profile.dev]
panic = "abort"
lto = true
opt-level = "z"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = 3

[target.avr-none]
rustflags = [
    "-C",
    "linker=avr-gcc",
    "-C",
    "linker-flavor=gcc",
    "-C",
    "target-cpu=atmega32u4",
    "-C",
    "link-arg=-mmcu=atmega32u4",
    "-C",
    "link-arg=-Wl,--gc-sections",
    "-C",
    "no-vectorize-loops",
]
